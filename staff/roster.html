<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>名簿 | 楽珠そろばん教室 講師ポータル</title>
  <link rel="icon" href="https://rakutama-tokyo.com/Pictures/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
    .tab-active { border-bottom: 3px solid #4A96AE; color: #4A96AE; font-weight: 700; }
    .school-active { background-color: #4A96AE; color: #fff; }
    .page-nav-link { padding: 10px 14px; font-size: 0.82rem; color: #6b7280; border-bottom: 3px solid transparent; transition: all .15s; }
    .page-nav-link:hover { color: #4A96AE; }
    .page-nav-active { color: #4A96AE; font-weight: 700; border-bottom-color: #4A96AE; }
    /* グリッドビュー */
    .grid-table { border-collapse: collapse; width: 100%; background: #fff; font-size: 0.8rem; }
    .grid-table th, .grid-table td { border: 1px solid #d1d5db; vertical-align: top; }
    .grid-th-school { background: #1e6fa3; color: #fff; font-weight: 700; text-align: center; padding: 6px 4px; font-size: 0.82rem; }
    .grid-th-day { background: #dbeafe; color: #1e6fa3; font-weight: 600; text-align: center; padding: 5px 4px; font-size: 0.78rem; }
    .grid-th-time { background: #f3f4f6; font-weight: 600; color: #374151; text-align: center; padding: 8px 6px; width: 36px; font-size: 0.8rem; }
    .grid-cell { padding: 4px; min-height: 60px; }
    .student-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 5px; padding: 4px 6px; margin: 2px 0; }
    .student-card.future { background: #fefce8; border-color: #fde68a; }
    .student-name { font-weight: 700; color: #111827; font-size: 0.82rem; }
    .student-kana { color: #6b7280; font-size: 0.68rem; margin-top: 1px; }
    .student-grade { color: #1d4ed8; font-size: 0.7rem; font-weight: 600; margin-top: 1px; }
    .student-since { color: #9ca3af; font-size: 0.65rem; margin-top: 1px; }
    /* 体験名簿カレンダービュー */
    .cal-table { border-collapse: collapse; width: 100%; background: #fff; }
    .cal-table th, .cal-table td { border: 1px solid #e5e7eb; vertical-align: top; }
    .cal-dow { background: #f3f4f6; color: #6b7280; font-weight: 600; text-align: center; padding: 6px 4px; font-size: 0.75rem; }
    .cal-cell { min-height: 78px; padding: 3px; vertical-align: top; }
    .cal-cell.other-month { background: #fafafa; }
    .cal-daynum { font-size: 0.7rem; color: #9ca3af; font-weight: 600; padding: 2px 3px 1px; }
    .cal-daynum.today { color: #fff; background: #4A96AE; border-radius: 999px; display: inline-block; width: 18px; height: 18px; text-align: center; line-height: 18px; }
    .cal-entry { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; padding: 2px 4px; margin: 2px 1px; font-size: 0.68rem; line-height: 1.3; }
    .cal-entry-name { font-weight: 700; color: #111827; }
    .cal-entry-time { color: #6b7280; }
  </style>
</head>
<body class="min-h-screen bg-base">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <span class="font-bold text-gray-800 text-base">楽珠そろばん教室</span>
        <span class="ml-2 text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">講師ポータル</span>
      </div>
      <button id="logoutBtn" class="text-sm text-gray-500 hover:text-red-500 transition flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        ログアウト
      </button>
    </div>
    <div class="border-t border-gray-100">
      <div class="max-w-5xl mx-auto px-4 flex gap-1">
        <a href="notice.html" class="page-nav-link">お知らせ/FAQ</a>
        <a href="roster.html" class="page-nav-link page-nav-active">名簿</a>
        <a href="jisseki.html" class="page-nav-link">実績</a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- 講師マニュアル・年間スケジュールリンク -->
    <div class="mb-4 flex flex-col sm:flex-row gap-2">
      <a href="講師マニュアル.pdf" target="_blank" rel="noopener"
        class="flex items-center gap-2 flex-1 bg-white border border-primary text-primary rounded-xl px-4 py-3 text-sm font-medium hover:bg-primary hover:text-white transition">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
        </svg>
        講師マニュアルを開く（PDF）
      </a>
      <a href="../Pictures/2026schedule.pdf" target="_blank" rel="noopener"
        class="flex items-center gap-2 flex-1 bg-white border border-primary text-primary rounded-xl px-4 py-3 text-sm font-medium hover:bg-primary hover:text-white transition">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        年間スケジュールを開く（PDF）
      </a>
    </div>

    <!-- 名簿種別タブ -->
    <div class="flex flex-wrap border-b border-gray-200 mb-5 bg-white rounded-t-xl overflow-hidden">
      <button data-tab="taiken"
        class="tab-btn flex-1 py-3 text-sm text-gray-500 transition tab-active"
        onclick="switchTab('taiken')">
        体験名簿
      </button>
      <button data-tab="seito"
        class="tab-btn flex-1 py-3 text-sm text-gray-500 transition"
        onclick="switchTab('seito')">
        在籍生徒
      </button>
      <button data-tab="kesseki"
        class="tab-btn flex-1 py-3 text-sm text-gray-500 transition"
        onclick="switchTab('kesseki')">
        欠席
      </button>
      <button data-tab="furikae"
        class="tab-btn flex-1 py-3 text-sm text-gray-500 transition"
        onclick="switchTab('furikae')">
        振替
      </button>
      <button data-tab="kentei"
        class="tab-btn flex-1 py-3 text-sm text-gray-500 transition"
        onclick="switchTab('kentei')">
        検定
      </button>
    </div>

    <!-- 校フィルター（実績・お知らせ/FAQタブでは非表示） -->
    <div id="schoolFilter" class="flex flex-wrap gap-2 mb-5">
      <button data-school="all"
        class="school-btn text-sm px-4 py-1.5 rounded-full border border-primary transition school-active"
        onclick="switchSchool('all')">全校</button>
      <button data-school="早宮校"
        class="school-btn text-sm px-4 py-1.5 rounded-full border border-primary text-primary transition"
        onclick="switchSchool('早宮校')">早宮校</button>
      <button data-school="氷川台校"
        class="school-btn text-sm px-4 py-1.5 rounded-full border border-primary text-primary transition"
        onclick="switchSchool('氷川台校')">氷川台校</button>
      <button data-school="中村校"
        class="school-btn text-sm px-4 py-1.5 rounded-full border border-primary text-primary transition"
        onclick="switchSchool('中村校')">中村校</button>
      <button data-school="平和台校"
        class="school-btn text-sm px-4 py-1.5 rounded-full border border-primary text-primary transition"
        onclick="switchSchool('平和台校')">平和台校</button>
    </div>

    <!-- 在籍生徒ビュー切り替え -->
    <div id="seitoViewToggle" class="hidden mb-4 flex items-center gap-2">
      <span class="text-sm text-gray-500">表示：</span>
      <button onclick="setSeitoView('grid')" id="btnGrid"
        class="view-btn text-xs px-3 py-1.5 rounded-full border border-primary bg-primary text-white font-medium transition">
        コマ別グリッド
      </button>
      <button onclick="setSeitoView('list')" id="btnList"
        class="view-btn text-xs px-3 py-1.5 rounded-full border border-primary text-primary transition">
        リスト
      </button>
    </div>

    <!-- 体験名簿ビュー切り替え -->
    <div id="taikenViewToggle" class="hidden mb-4 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-500">表示：</span>
        <button onclick="setTaikenView('list')" id="btnTaikenList"
          class="view-btn text-xs px-3 py-1.5 rounded-full border border-primary bg-primary text-white font-medium transition">
          リスト
        </button>
        <button onclick="setTaikenView('calendar')" id="btnTaikenCalendar"
          class="view-btn text-xs px-3 py-1.5 rounded-full border border-primary text-primary transition">
          カレンダー
        </button>
      </div>
      <div id="calNav" class="hidden items-center gap-3">
        <button onclick="changeCalMonth(-1)" class="text-primary hover:text-[#3a86a0] p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <span id="calLabel" class="text-sm font-bold text-gray-700 min-w-[5.5rem] text-center"></span>
        <button onclick="changeCalMonth(1)" class="text-primary hover:text-[#3a86a0] p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
        <button onclick="goToCurrentMonth()" class="text-xs text-primary underline ml-1">今月</button>
      </div>
    </div>

    <!-- 件数・更新ボタン（実績・お知らせ/FAQタブでは非表示） -->
    <div id="countBar" class="flex items-center justify-between mb-3">
      <p class="text-sm text-gray-500">
        <span id="countLabel">読み込み中…</span>
      </p>
      <button id="reloadBtn" onclick="loadData()"
        class="text-sm text-primary hover:text-[#3a86a0] flex items-center gap-1 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        更新
      </button>
    </div>

    <!-- ローディング -->
    <div id="loading" class="text-center py-16 text-gray-400 text-sm">
      <svg class="w-8 h-8 animate-spin mx-auto mb-3 text-primary" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
      </svg>
      読み込み中…
    </div>

    <!-- エラー -->
    <div id="errorArea" class="hidden text-center py-12 text-red-500 text-sm bg-red-50 rounded-xl">
      <p id="errorText">データの取得に失敗しました</p>
      <button onclick="loadData()" class="mt-3 text-primary underline text-sm">再試行</button>
    </div>

    <!-- テーブルコンテナ -->
    <div id="tableArea" class="hidden overflow-x-auto rounded-xl shadow-sm">
      <table class="w-full bg-white text-sm border-collapse">
        <thead id="tableHead" class="bg-primary text-white text-left"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- グリッドビュー（在籍生徒） -->
    <div id="gridArea" class="hidden overflow-x-auto rounded-xl shadow-sm">
      <table class="grid-table" id="gridTable">
        <thead id="gridHead"></thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>

    <!-- カレンダービュー（体験名簿） -->
    <div id="calendarArea" class="hidden overflow-x-auto rounded-xl shadow-sm">
      <table class="cal-table" id="calTable">
        <thead>
          <tr>
            <th class="cal-dow">日</th><th class="cal-dow">月</th><th class="cal-dow">火</th>
            <th class="cal-dow">水</th><th class="cal-dow">木</th><th class="cal-dow">金</th><th class="cal-dow">土</th>
          </tr>
        </thead>
        <tbody id="calBody"></tbody>
      </table>
    </div>

    <!-- 空状態 -->
    <div id="emptyArea" class="hidden text-center py-16 text-gray-400 text-sm">
      該当するデータがありません
    </div>

  </main>

  <script>
    const API = 'https://rakutama-kintone.k-ariyama.workers.dev';

    let currentTab = 'taiken';
    let currentSchool = 'all';
    let staffKey = '';
    let seitoView = 'grid'; // 'grid' or 'list'
    let taikenView = 'list'; // 'list' or 'calendar'
    let cachedSeitoRecords = null;
    let cachedKessekiRecords = null;
    let cachedFurikaeRecords = null;
    let cachedTaikenRecords = null;
    let cachedKenteiRecords = null;
    const now = new Date();
    let calYear = now.getFullYear();
    let calMonth = now.getMonth(); // 0-11

    const GRID_COLS = [
      { school: '早宮校',  day: '火' },
      { school: '早宮校',  day: '金' },
      { school: '氷川台校', day: '月' },
      { school: '氷川台校', day: '水' },
      { school: '中村校',  day: '月' },
      { school: '中村校',  day: '木' },
      { school: '平和台校', day: '月' },
      { school: '平和台校', day: '木' },
    ];
    const GRID_TIMES = ['16', '17'];

    // ── 認証チェック ──────────────────────────────────────────────
    staffKey = sessionStorage.getItem('staffKey');
    if (!staffKey) {
      location.href = 'index.html';
    }

    // ── ログアウト ────────────────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('staffKey');
      location.href = 'index.html';
    });

    // ── タブ切り替え ──────────────────────────────────────────────
    function switchTab(tab) {
      currentTab = tab;
      cachedSeitoRecords = null;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('tab-active', btn.dataset.tab === tab);
      });
      const isSeito = tab === 'seito';
      const isTaiken = tab === 'taiken';
      document.getElementById('seitoViewToggle').classList.toggle('hidden', !isSeito);
      document.getElementById('taikenViewToggle').classList.toggle('hidden', !isTaiken);
      document.getElementById('calNav').classList.toggle('hidden', !(isTaiken && taikenView === 'calendar'));
      document.getElementById('calNav').classList.toggle('flex', isTaiken && taikenView === 'calendar');
      // 欠席・振替タブのキャッシュをクリア
      cachedKessekiRecords = null;
      cachedFurikaeRecords = null;
      cachedTaikenRecords = null;
      cachedKenteiRecords = null;
      loadData();
    }

    // ── 在籍生徒ビュー切り替え ───────────────────────────────────
    function setSeitoView(view) {
      seitoView = view;
      document.getElementById('btnGrid').className =
        'view-btn text-xs px-3 py-1.5 rounded-full border border-primary transition ' +
        (view === 'grid' ? 'bg-primary text-white font-medium' : 'text-primary');
      document.getElementById('btnList').className =
        'view-btn text-xs px-3 py-1.5 rounded-full border border-primary transition ' +
        (view === 'list' ? 'bg-primary text-white font-medium' : 'text-primary');
      if (cachedSeitoRecords) {
        renderTable(cachedSeitoRecords);
      }
    }

    // ── 体験名簿ビュー切り替え ───────────────────────────────────
    function setTaikenView(view) {
      taikenView = view;
      document.getElementById('btnTaikenList').className =
        'view-btn text-xs px-3 py-1.5 rounded-full border border-primary transition ' +
        (view === 'list' ? 'bg-primary text-white font-medium' : 'text-primary');
      document.getElementById('btnTaikenCalendar').className =
        'view-btn text-xs px-3 py-1.5 rounded-full border border-primary transition ' +
        (view === 'calendar' ? 'bg-primary text-white font-medium' : 'text-primary');
      const isCal = view === 'calendar';
      document.getElementById('calNav').classList.toggle('hidden', !isCal);
      document.getElementById('calNav').classList.toggle('flex', isCal);
      if (cachedTaikenRecords) {
        renderTable(cachedTaikenRecords);
      }
    }

    // ── 体験カレンダー月送り ─────────────────────────────────────
    function changeCalMonth(diff) {
      calMonth += diff;
      if (calMonth < 0) { calMonth = 11; calYear -= 1; }
      if (calMonth > 11) { calMonth = 0; calYear += 1; }
      if (cachedTaikenRecords) renderTaikenCalendar(cachedTaikenRecords);
    }

    function goToCurrentMonth() {
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      if (cachedTaikenRecords) renderTaikenCalendar(cachedTaikenRecords);
    }

    // ── 校フィルター ──────────────────────────────────────────────
    function switchSchool(school) {
      currentSchool = school;
      cachedKessekiRecords = null;
      cachedFurikaeRecords = null;
      document.querySelectorAll('.school-btn').forEach(btn => {
        const active = btn.dataset.school === school;
        btn.classList.toggle('school-active', active);
        btn.classList.toggle('text-primary', !active);
        btn.classList.toggle('text-white', active);
      });
      loadData();
    }

    // ── データ取得 ────────────────────────────────────────────────
    async function loadData() {
      showState('loading');

      const endpoint = currentTab === 'taiken' ? '/api/staff/taiken'
                     : currentTab === 'seito'  ? '/api/staff/seito'
                     : currentTab === 'kentei' ? '/api/staff/kentei'
                     : '/api/staff/kesseki';
      const url = (currentTab === 'kesseki' || currentTab === 'furikae')
        ? `${API}${endpoint}?school=${encodeURIComponent(currentSchool)}&tab=${currentTab}`
        : `${API}${endpoint}?school=${encodeURIComponent(currentSchool)}`;

      // 欠席タブ・振替タブはホーム教室／振替先教室で絞り込みが異なるためキャッシュは別々に保持
      if (currentTab === 'kesseki' && cachedKessekiRecords) {
        renderTable(cachedKessekiRecords);
        return;
      }
      if (currentTab === 'furikae' && cachedFurikaeRecords) {
        renderTable(cachedFurikaeRecords);
        return;
      }
      if (currentTab === 'kentei' && cachedKenteiRecords) {
        renderTable(cachedKenteiRecords);
        return;
      }

      try {
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${staffKey}` },
        });

        if (res.status === 401) {
          sessionStorage.removeItem('staffKey');
          location.href = 'index.html';
          return;
        }

        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        if (currentTab === 'seito') cachedSeitoRecords = data.records;
        if (currentTab === 'kesseki') cachedKessekiRecords = data.records;
        if (currentTab === 'furikae') cachedFurikaeRecords = data.records;
        if (currentTab === 'taiken') cachedTaikenRecords = data.records;
        if (currentTab === 'kentei') cachedKenteiRecords = data.records;
        renderTable(data.records);
      } catch (err) {
        document.getElementById('errorText').textContent =
          'データの取得に失敗しました: ' + (err.message || '不明なエラー');
        showState('error');
      }
    }

    // ── テーブル描画 ──────────────────────────────────────────────
    function renderTable(records) {
      if (records.length === 0) {
        showState('empty');
        document.getElementById('countLabel').textContent = '0件';
        return;
      }

      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');

      if (currentTab === 'taiken') {
        if (taikenView === 'calendar') {
          renderTaikenCalendar(records);
          return;
        }

        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3 font-medium whitespace-nowrap">教室</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">体験参加日</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">時刻</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">氏名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">フリガナ</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">学年</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">そろばん経験</th>
          </tr>`;

        tbody.innerHTML = records.map((r, i) => `
          <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition">
            <td class="px-4 py-3 whitespace-nowrap">${schoolBadge(r.教室名)}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${formatDate(r.体験参加日)}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.時刻 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-800">${r.氏} ${r.名}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-500 text-xs">${r.フリガナ || ''}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.学年 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap">${experienceBadge(r.そろばん経験)}</td>
          </tr>`).join('');

      } else if (currentTab === 'seito') {
        if (seitoView === 'grid') {
          renderGrid(records);
          const countBase = records.filter(r => !String(r.生徒番号 || '').includes('-')).length;
          document.getElementById('countLabel').textContent = `${countBase}件`;
          showState('grid');
          return;
        }

        // リストビュー
        records.sort((a, b) => {
          const s = (a.教室名 || '').localeCompare(b.教室名 || '', 'ja');
          if (s !== 0) return s;
          const c = (a.クラス || '').localeCompare(b.クラス || '', 'ja');
          if (c !== 0) return c;
          return (a.フリガナ || '').localeCompare(b.フリガナ || '', 'ja');
        });

        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3 font-medium whitespace-nowrap">教室</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">生徒番号</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">氏名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">フリガナ</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">学年</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">クラス</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">コース名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">初回授業日</th>
          </tr>`;

        tbody.innerHTML = records.map((r, i) => `
          <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition">
            <td class="px-4 py-3 whitespace-nowrap">${schoolBadge(r.教室名)}</td>
            <td class="px-4 py-3 whitespace-nowrap font-mono text-xs text-gray-500">${r.生徒番号 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-800">${r.氏} ${r.名}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-500 text-xs">${r.フリガナ || ''}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.学年 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.クラス || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.コース名 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-600">${formatDate(r.初回授業日)}</td>
          </tr>`).join('');

      } else if (currentTab === 'kesseki') {
        // 欠席タブ：欠席日・振替状況・期限のみ（列を絞って縦に読みやすく）
        // 過去の欠席日かつ振替済みのものは一覧から除外
        const today = todayISO();
        records = records.filter(r => !(r.欠席日 && r.欠席日 < today && r.振替受講日));

        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3 font-medium whitespace-nowrap">教室</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">氏名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">欠席日</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">振替状況</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">振替期限</th>
          </tr>`;

        tbody.innerHTML = records.map((r, i) => `
          <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition">
            <td class="px-4 py-3 whitespace-nowrap">${schoolBadge(r.教室名)}</td>
            <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-800">${r.氏} ${r.名}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${formatDateWithDay(r.欠席日)}</td>
            <td class="px-4 py-3 whitespace-nowrap">${furikaeBadge(r.振替受講日)}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-500 text-xs">${formatDate(r.振替期日_終_)}</td>
          </tr>`).join('');

      } else if (currentTab === 'kentei') {
        // 検定タブ：今後の受験予定（誰が・いつ・どの級を受けるか）
        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3 font-medium whitespace-nowrap">教室</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">受験日</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">氏名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">珠算受験級</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">暗算受験級</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">受験会場</th>
          </tr>`;

        tbody.innerHTML = records.map((r, i) => `
          <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition">
            <td class="px-4 py-3 whitespace-nowrap">${schoolBadge(r.教室名)}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${formatDateWithDay(r.受験日)}</td>
            <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-800">${r.氏} ${r.名}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.珠算受験級 ? `${r.珠算受験級}${r.珠算受験時刻 ? '（' + r.珠算受験時刻.slice(0, 5) + '）' : ''}` : '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.暗算受験級 ? `${r.暗算受験級}${r.暗算受験時刻 ? '（' + r.暗算受験時刻.slice(0, 5) + '）' : ''}` : '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-500 text-xs">${r.受験会場 || '―'}</td>
          </tr>`).join('');

      } else {
        // 振替タブ：振替受講日が確定していて、かつ今日以降のものだけ表示
        const furikaeRecords = records.filter(r => r.振替受講日 && r.振替受講日 >= todayISO());
        if (furikaeRecords.length === 0) {
          document.getElementById('countLabel').textContent = '0件';
          showState('empty');
          return;
        }

        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3 font-medium whitespace-nowrap">振替先教室</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">氏名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">振替受講日</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">時刻</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">ホーム教室</th>
          </tr>`;

        // 振替受講日順に並べる
        furikaeRecords.sort((a, b) => (a.振替受講日 || '').localeCompare(b.振替受講日 || ''));

        tbody.innerHTML = furikaeRecords.map((r, i) => `
          <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition">
            <td class="px-4 py-3 whitespace-nowrap">${schoolBadge(r.振替教室名 || r.教室名)}</td>
            <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-800">${r.氏} ${r.名}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${formatDateWithDay(r.振替受講日)}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.時刻 ? r.時刻.slice(0, 5) : '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap">${schoolBadge(r.教室名)}</td>
          </tr>`).join('');

        document.getElementById('countLabel').textContent = `${furikaeRecords.length}件`;
        showState('table');
        return;
      }

      // 在籍生徒タブは生徒番号に"-"を含むサブ番号レコードを件数から除外
      const countBase = currentTab === 'seito'
        ? records.filter(r => !String(r.生徒番号 || '').includes('-')).length
        : records.length;
      document.getElementById('countLabel').textContent = `${countBase}件`;
      showState('table');
    }

    // ── グリッドヘッダー描画 ──────────────────────────────────────
    function renderGridHeader(cols) {
      const schools = [...new Set(cols.map(c => c.school))];
      const schoolRow = schools.map(s => {
        const span = cols.filter(c => c.school === s).length;
        return `<th class="grid-th-school" colspan="${span}">${s}</th>`;
      }).join('');
      const dayRow = cols.map(c => `<th class="grid-th-day">${c.day}</th>`).join('');
      document.getElementById('gridHead').innerHTML = `
        <tr>
          <th class="grid-th-time" rowspan="2"></th>
          ${schoolRow}
        </tr>
        <tr>${dayRow}</tr>`;
    }

    // ── グリッド描画 ──────────────────────────────────────────────
    function renderGrid(records) {
      // 校フィルターで選択中の教室だけに絞る（全校選択時は全列）
      const cols = GRID_COLS.filter(c => currentSchool === 'all' || c.school === currentSchool);
      renderGridHeader(cols);

      // grid[school][day][time] = [student, ...]
      const grid = {};
      for (const col of cols) {
        if (!grid[col.school]) grid[col.school] = {};
        if (!grid[col.school][col.day]) grid[col.school][col.day] = {};
        for (const t of GRID_TIMES) grid[col.school][col.day][t] = [];
      }

      for (const r of records) {
        const school = r.教室名;
        if (!grid[school]) continue;
        const komas = [r.コマ1, r.コマ2, r.コマ3, r.コマ4, r.コマ5].filter(Boolean);
        for (const koma of komas) {
          const day = koma.charAt(0);
          const time = koma.slice(1);
          if (grid[school][day] && grid[school][day][time] !== undefined) {
            grid[school][day][time].push(r);
          }
        }
      }

      const tbody = document.getElementById('gridBody');
      tbody.innerHTML = GRID_TIMES.map(time => `
        <tr>
          <th class="grid-th-time">${time}</th>
          ${cols.map(col => {
            const students = grid[col.school]?.[col.day]?.[time] ?? [];
            if (students.length === 0) {
              return `<td><div class="grid-cell"></div></td>`;
            }
            const today = new Date(); today.setHours(0,0,0,0);
            const cards = students.map(s => {
              const isFuture = s.初回授業日 && new Date(s.初回授業日) > today;
              return `
              <div class="student-card${isFuture ? ' future' : ''}">
                <div class="student-name">${s.氏} ${s.名}</div>
                <div class="student-kana">${s.フリガナ || ''}</div>
                <div class="student-grade">${s.学年 || ''}</div>
                ${s.初回授業日 ? `<div class="student-since">${s.初回授業日.replace(/-/g, '/')}</div>` : ''}
              </div>`;
            }).join('');
            return `<td><div class="grid-cell">${cards}</div></td>`;
          }).join('')}
        </tr>`).join('');
    }

    // ── 体験名簿カレンダー描画 ────────────────────────────────────
    function renderTaikenCalendar(records) {
      document.getElementById('calLabel').textContent = `${calYear}年${calMonth + 1}月`;

      // 日付ごとにグルーピング
      const byDate = {};
      for (const r of records) {
        const d = r.体験参加日;
        if (!d) continue;
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(r);
      }
      // 同日内は時刻順
      for (const d in byDate) {
        byDate[d].sort((a, b) => (a.時刻 || '').localeCompare(b.時刻 || ''));
      }

      const firstDow = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const prevDays = new Date(calYear, calMonth, 0).getDate();
      const todayStr = todayISO();

      const cells = [];
      // 前月の埋め
      for (let i = firstDow - 1; i >= 0; i--) {
        cells.push({ day: prevDays - i, other: true, dateStr: null });
      }
      // 当月
      for (let d = 1; d <= daysInMonth; d++) {
        const mm = String(calMonth + 1).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        cells.push({ day: d, other: false, dateStr: `${calYear}-${mm}-${dd}` });
      }
      // 翌月の埋め（7の倍数になるまで）
      let nextDay = 1;
      while (cells.length % 7 !== 0) {
        cells.push({ day: nextDay++, other: true, dateStr: null });
      }

      let monthCount = 0;
      const rows = [];
      for (let w = 0; w < cells.length / 7; w++) {
        const rowCells = cells.slice(w * 7, w * 7 + 7).map(c => {
          if (c.other) {
            return `<td class="cal-cell other-month"><div class="cal-daynum">${c.day}</div></td>`;
          }
          const entries = byDate[c.dateStr] || [];
          monthCount += entries.length;
          const isToday = c.dateStr === todayStr;
          const entryHtml = entries.map(r => `
            <div class="cal-entry">
              <span class="cal-entry-time">${r.時刻 || ''}</span>
              <span class="cal-entry-name">${r.氏}${r.名}</span>
              ${schoolBadge(r.教室名)}
            </div>`).join('');
          return `<td class="cal-cell">
            <div class="cal-daynum${isToday ? ' today' : ''}">${c.day}</div>
            ${entryHtml}
          </td>`;
        }).join('');
        rows.push(`<tr>${rowCells}</tr>`);
      }

      document.getElementById('calBody').innerHTML = rows.join('');
      document.getElementById('countLabel').textContent = `${monthCount}件（${calYear}年${calMonth + 1}月）`;
      showState('calendar');
    }

    // ── UI ヘルパー ───────────────────────────────────────────────
    function showState(state) {
      document.getElementById('loading').classList.toggle('hidden', state !== 'loading');
      document.getElementById('errorArea').classList.toggle('hidden', state !== 'error');
      document.getElementById('tableArea').classList.toggle('hidden', state !== 'table');
      document.getElementById('gridArea').classList.toggle('hidden', state !== 'grid');
      document.getElementById('calendarArea').classList.toggle('hidden', state !== 'calendar');
      document.getElementById('emptyArea').classList.toggle('hidden', state !== 'empty');
      if (state === 'loading') {
        document.getElementById('countLabel').textContent = '読み込み中…';
      }
    }

    function formatDate(val) {
      if (!val) return '―';
      return val.replace(/-/g, '/');
    }

    function todayISO() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${d.getFullYear()}-${m}-${day}`;
    }

    const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];

    function formatDateWithDay(val) {
      if (!val) return '―';
      const [y, m, d] = val.split('-').map(Number);
      const day = DAY_NAMES[new Date(y, m - 1, d).getDay()];
      return val.replace(/-/g, '/') + `（${day}）`;
    }

    function furikaeBadge(振替受講日) {
      if (振替受講日) {
        return `<span class="inline-block text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-medium">振替済み</span>`;
      }
      return `<span class="inline-block text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 font-medium">未振替</span>`;
    }

    const SCHOOL_COLORS = {
      '早宮校':  { bg: 'bg-blue-100',  text: 'text-blue-700'  },
      '氷川台校': { bg: 'bg-teal-100',  text: 'text-teal-700'  },
      '中村校':  { bg: 'bg-purple-100', text: 'text-purple-700' },
      '平和台校': { bg: 'bg-amber-100', text: 'text-amber-700' },
    };

    function schoolBadge(name) {
      const c = SCHOOL_COLORS[name] ?? { bg: 'bg-gray-100', text: 'text-gray-600' };
      return `<span class="inline-block text-xs px-2 py-0.5 rounded-full font-medium ${c.bg} ${c.text}">${name || '不明'}</span>`;
    }

    function experienceBadge(val) {
      if (val === 'あり') {
        return `<span class="inline-block text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-medium">あり</span>`;
      }
      return `<span class="inline-block text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">なし</span>`;
    }

    // ── 初回ロード ────────────────────────────────────────────────
    loadData();
  </script>
</body>
</html>
