<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>名簿 | 楽珠そろばん教室 講師ポータル</title>
  <link rel="icon" href="https://rakutama-tokyo.com/Pictures/favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <meta name="robots" content="noindex, nofollow" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4A96AE',
            base: '#F7FBFA',
          },
          fontFamily: {
            sans: ['Noto Sans JP', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
    .tab-active { border-bottom: 3px solid #4A96AE; color: #4A96AE; font-weight: 700; }
    .school-active { background-color: #4A96AE; color: #fff; }
  </style>
</head>
<body class="min-h-screen bg-base">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <span class="font-bold text-gray-800 text-base">楽珠そろばん教室</span>
        <span class="ml-2 text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">講師ポータル</span>
      </div>
      <button id="logoutBtn" class="text-sm text-gray-500 hover:text-red-500 transition flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        ログアウト
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- 名簿種別タブ -->
    <div class="flex border-b border-gray-200 mb-5 bg-white rounded-t-xl overflow-hidden">
      <button data-tab="taiken"
        class="tab-btn flex-1 py-3 text-sm text-gray-500 transition tab-active"
        onclick="switchTab('taiken')">
        体験名簿
      </button>
      <button data-tab="seito"
        class="tab-btn flex-1 py-3 text-sm text-gray-500 transition"
        onclick="switchTab('seito')">
        在籍生徒
      </button>
      <button data-tab="kesseki"
        class="tab-btn flex-1 py-3 text-sm text-gray-500 transition"
        onclick="switchTab('kesseki')">
        欠席・振替
      </button>
      <button data-tab="stats"
        class="tab-btn flex-1 py-3 text-sm text-gray-500 transition"
        onclick="switchTab('stats')">
        実績
      </button>
    </div>

    <!-- 校フィルター（実績タブでは非表示） -->
    <div id="schoolFilter" class="flex flex-wrap gap-2 mb-5">
      <button data-school="all"
        class="school-btn text-sm px-4 py-1.5 rounded-full border border-primary transition school-active"
        onclick="switchSchool('all')">全校</button>
      <button data-school="早宮校"
        class="school-btn text-sm px-4 py-1.5 rounded-full border border-primary text-primary transition"
        onclick="switchSchool('早宮校')">早宮校</button>
      <button data-school="氷川台校"
        class="school-btn text-sm px-4 py-1.5 rounded-full border border-primary text-primary transition"
        onclick="switchSchool('氷川台校')">氷川台校</button>
      <button data-school="中村校"
        class="school-btn text-sm px-4 py-1.5 rounded-full border border-primary text-primary transition"
        onclick="switchSchool('中村校')">中村校</button>
    </div>

    <!-- 件数・更新ボタン（実績タブでは非表示） -->
    <div id="countBar" class="flex items-center justify-between mb-3">
      <p class="text-sm text-gray-500">
        <span id="countLabel">読み込み中…</span>
      </p>
      <button id="reloadBtn" onclick="loadData()"
        class="text-sm text-primary hover:text-[#3a86a0] flex items-center gap-1 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        更新
      </button>
    </div>

    <!-- ローディング -->
    <div id="loading" class="text-center py-16 text-gray-400 text-sm">
      <svg class="w-8 h-8 animate-spin mx-auto mb-3 text-primary" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
      </svg>
      読み込み中…
    </div>

    <!-- エラー -->
    <div id="errorArea" class="hidden text-center py-12 text-red-500 text-sm bg-red-50 rounded-xl">
      <p id="errorText">データの取得に失敗しました</p>
      <button onclick="loadData()" class="mt-3 text-primary underline text-sm">再試行</button>
    </div>

    <!-- テーブルコンテナ -->
    <div id="tableArea" class="hidden overflow-x-auto rounded-xl shadow-sm">
      <table class="w-full bg-white text-sm border-collapse">
        <thead id="tableHead" class="bg-primary text-white text-left"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- 空状態 -->
    <div id="emptyArea" class="hidden text-center py-16 text-gray-400 text-sm">
      該当するデータがありません
    </div>

    <!-- 実績パネル -->
    <div id="statsArea" class="hidden space-y-6">

      <!-- 生徒数カード -->
      <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
        <div class="bg-white rounded-2xl shadow-sm p-4 col-span-2 sm:col-span-1">
          <p class="text-xs text-gray-400 mb-1">全校 在籍生徒</p>
          <p class="text-3xl font-bold text-gray-800" id="st-total">—</p>
          <p class="text-xs text-gray-400 mt-1">名</p>
          <div id="st-breakeven-msg" class="mt-2 text-xs font-medium"></div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm p-4">
          <p class="text-xs mb-1" style="color:#3b82f6">早宮校</p>
          <p class="text-2xl font-bold text-gray-800" id="st-hayamiya">—</p>
          <p class="text-xs text-gray-400">名</p>
        </div>
        <div class="bg-white rounded-2xl shadow-sm p-4">
          <p class="text-xs mb-1" style="color:#14b8a6">氷川台校</p>
          <p class="text-2xl font-bold text-gray-800" id="st-hikawadai">—</p>
          <p class="text-xs text-gray-400">名</p>
        </div>
        <div class="bg-white rounded-2xl shadow-sm p-4">
          <p class="text-xs mb-1" style="color:#a855f7">中村校</p>
          <p class="text-2xl font-bold text-gray-800" id="st-nakamura">—</p>
          <p class="text-xs text-gray-400">名</p>
        </div>
      </div>

      <!-- 月別入会率テーブル -->
      <div class="bg-white rounded-2xl shadow-sm overflow-x-auto">
        <div class="px-4 pt-4 pb-2 flex items-center justify-between">
          <p class="text-sm font-bold text-gray-700">月別入会率</p>
          <p class="text-xs text-gray-400">入会者数 ÷ 体験参加者数（2回目除く）</p>
        </div>
        <table class="w-full text-sm border-collapse" id="statsTable">
          <thead>
            <tr class="bg-primary text-white text-left">
              <th class="px-4 py-2 font-medium whitespace-nowrap">月</th>
              <th class="px-4 py-2 font-medium whitespace-nowrap text-right">全体</th>
              <th class="px-4 py-2 font-medium whitespace-nowrap text-right">早宮校</th>
              <th class="px-4 py-2 font-medium whitespace-nowrap text-right">氷川台校</th>
              <th class="px-4 py-2 font-medium whitespace-nowrap text-right">中村校</th>
            </tr>
          </thead>
          <tbody id="statsTableBody"></tbody>
        </table>
        <div id="statsEmpty" class="hidden text-center py-10 text-gray-400 text-sm">データがありません</div>
      </div>

      <!-- 更新ボタン -->
      <div class="text-right">
        <button onclick="loadData()" class="text-sm text-primary hover:text-[#3a86a0] flex items-center gap-1 transition ml-auto">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          更新
        </button>
      </div>

    </div>

  </main>

  <script>
    const API = 'https://rakutama-kintone.k-ariyama.workers.dev';

    let currentTab = 'taiken';
    let currentSchool = 'all';
    let staffKey = '';

    // ── 認証チェック ──────────────────────────────────────────────
    staffKey = sessionStorage.getItem('staffKey');
    if (!staffKey) {
      location.href = 'index.html';
    }

    // ── ログアウト ────────────────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('staffKey');
      location.href = 'index.html';
    });

    // ── タブ切り替え ──────────────────────────────────────────────
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('tab-active', btn.dataset.tab === tab);
      });
      const isStats = tab === 'stats';
      document.getElementById('schoolFilter').classList.toggle('hidden', isStats);
      document.getElementById('countBar').classList.toggle('hidden', isStats);
      loadData();
    }

    // ── 校フィルター ──────────────────────────────────────────────
    function switchSchool(school) {
      currentSchool = school;
      document.querySelectorAll('.school-btn').forEach(btn => {
        const active = btn.dataset.school === school;
        btn.classList.toggle('school-active', active);
        btn.classList.toggle('text-primary', !active);
        btn.classList.toggle('text-white', active);
      });
      loadData();
    }

    // ── データ取得 ────────────────────────────────────────────────
    async function loadData() {
      showState('loading');

      if (currentTab === 'stats') {
        try {
          const res = await fetch(`${API}/api/staff/stats`, {
            headers: { 'Authorization': `Bearer ${staffKey}` },
          });
          if (res.status === 401) { sessionStorage.removeItem('staffKey'); location.href = 'index.html'; return; }
          const data = await res.json();
          if (!data.success) throw new Error(data.error);
          renderStats(data);
        } catch (err) {
          document.getElementById('errorText').textContent =
            'データの取得に失敗しました: ' + (err.message || '不明なエラー');
          showState('error');
        }
        return;
      }

      const endpoint = currentTab === 'taiken' ? '/api/staff/taiken'
                     : currentTab === 'seito'  ? '/api/staff/seito'
                     : '/api/staff/kesseki';
      const url = `${API}${endpoint}?school=${encodeURIComponent(currentSchool)}`;

      try {
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${staffKey}` },
        });

        if (res.status === 401) {
          sessionStorage.removeItem('staffKey');
          location.href = 'index.html';
          return;
        }

        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        renderTable(data.records);
      } catch (err) {
        document.getElementById('errorText').textContent =
          'データの取得に失敗しました: ' + (err.message || '不明なエラー');
        showState('error');
      }
    }

    // ── テーブル描画 ──────────────────────────────────────────────
    function renderTable(records) {
      if (records.length === 0) {
        showState('empty');
        document.getElementById('countLabel').textContent = '0件';
        return;
      }

      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');

      if (currentTab === 'taiken') {
        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3 font-medium whitespace-nowrap">教室</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">体験参加日</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">時刻</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">氏名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">フリガナ</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">学年</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">そろばん経験</th>
          </tr>`;

        tbody.innerHTML = records.map((r, i) => `
          <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition">
            <td class="px-4 py-3 whitespace-nowrap">${schoolBadge(r.教室名)}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${formatDate(r.体験参加日)}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.時刻 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-800">${r.氏} ${r.名}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-500 text-xs">${r.フリガナ || ''}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.学年 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap">${experienceBadge(r.そろばん経験)}</td>
          </tr>`).join('');

      } else if (currentTab === 'seito') {
        records.sort((a, b) => {
          const s = (a.教室名 || '').localeCompare(b.教室名 || '', 'ja');
          if (s !== 0) return s;
          const c = (a.クラス || '').localeCompare(b.クラス || '', 'ja');
          if (c !== 0) return c;
          return (a.フリガナ || '').localeCompare(b.フリガナ || '', 'ja');
        });

        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3 font-medium whitespace-nowrap">教室</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">生徒番号</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">氏名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">フリガナ</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">学年</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">クラス</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">コース名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">初回授業日</th>
          </tr>`;

        tbody.innerHTML = records.map((r, i) => `
          <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition">
            <td class="px-4 py-3 whitespace-nowrap">${schoolBadge(r.教室名)}</td>
            <td class="px-4 py-3 whitespace-nowrap font-mono text-xs text-gray-500">${r.生徒番号 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-800">${r.氏} ${r.名}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-500 text-xs">${r.フリガナ || ''}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.学年 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.クラス || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${r.コース名 || '―'}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-600">${formatDate(r.初回授業日)}</td>
          </tr>`).join('');

      } else {
        thead.innerHTML = `
          <tr>
            <th class="px-4 py-3 font-medium whitespace-nowrap">教室</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">氏名</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">欠席日</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">振替状況</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">振替受講日・時刻</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">振替先教室</th>
            <th class="px-4 py-3 font-medium whitespace-nowrap">振替期限</th>
          </tr>`;

        tbody.innerHTML = records.map((r, i) => {
          const furikaeSchool = r.振替教室名 && r.振替教室名 !== r.教室名
            ? schoolBadge(r.振替教室名)
            : (r.振替教室名 ? schoolBadge(r.振替教室名) : '―');
          const furikaeTime = r.振替受講日
            ? formatDateWithDay(r.振替受講日) + (r.時刻 ? '&nbsp;' + r.時刻.slice(0, 5) : '')
            : '―';
          return `
          <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition">
            <td class="px-4 py-3 whitespace-nowrap">${schoolBadge(r.教室名)}</td>
            <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-800">${r.氏} ${r.名}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${formatDateWithDay(r.欠席日)}</td>
            <td class="px-4 py-3 whitespace-nowrap">${furikaeBadge(r.振替受講日)}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-700">${furikaeTime}</td>
            <td class="px-4 py-3 whitespace-nowrap">${furikaeSchool}</td>
            <td class="px-4 py-3 whitespace-nowrap text-gray-500 text-xs">${formatDate(r.振替期日_終_)}</td>
          </tr>`;
        }).join('');
      }

      // 在籍生徒タブは生徒番号に"-"を含むサブ番号レコードを件数から除外
      const countBase = currentTab === 'seito'
        ? records.filter(r => !String(r.生徒番号 || '').includes('-')).length
        : records.length;
      document.getElementById('countLabel').textContent = `${countBase}件`;
      showState('table');
    }

    // ── 実績描画 ──────────────────────────────────────────────────
    function renderStats(data) {
      const { seito_count, breakeven, monthly } = data;

      document.getElementById('st-total').textContent = seito_count.total;
      document.getElementById('st-hayamiya').textContent = seito_count['早宮校'] ?? 0;
      document.getElementById('st-hikawadai').textContent = seito_count['氷川台校'] ?? 0;
      document.getElementById('st-nakamura').textContent = seito_count['中村校'] ?? 0;

      const msg = document.getElementById('st-breakeven-msg');
      const remaining = breakeven - seito_count.total;
      if (remaining <= 0) {
        msg.textContent = '🎉 黒字化達成！';
        msg.className = 'mt-2 text-xs font-medium text-green-600';
      } else {
        msg.textContent = `黒字化まであと ${remaining} 名`;
        msg.className = 'mt-2 text-xs font-medium text-orange-500';
      }

      const tbody = document.getElementById('statsTableBody');
      const statsEmpty = document.getElementById('statsEmpty');
      const statsTable = document.getElementById('statsTable');

      if (!monthly || monthly.length === 0) {
        statsTable.classList.add('hidden');
        statsEmpty.classList.remove('hidden');
      } else {
        statsTable.classList.remove('hidden');
        statsEmpty.classList.add('hidden');
        tbody.innerHTML = monthly.map((row, i) => {
          const bg = i % 2 === 0 ? 'bg-white' : 'bg-gray-50';
          return `<tr class="${bg} hover:bg-blue-50 transition">
            <td class="px-4 py-2 whitespace-nowrap text-gray-700">${row.month.replace('-', '/')}</td>
            ${['全体', '早宮校', '氷川台校', '中村校'].map(label => {
              const d = row[label] ?? { taiken: 0, nyukai: 0 };
              const rate = d.taiken > 0 ? Math.round(d.nyukai / d.taiken * 100) : null;
              const rateStr = rate !== null ? `${rate}%` : '―';
              const color = rate === null ? 'text-gray-400' : rate >= 50 ? 'text-green-600 font-bold' : rate >= 30 ? 'text-amber-600' : 'text-gray-700';
              return `<td class="px-4 py-2 text-right whitespace-nowrap">
                <span class="${color}">${rateStr}</span>
                <span class="text-xs text-gray-400 ml-1">${d.nyukai}/${d.taiken}</span>
              </td>`;
            }).join('')}
          </tr>`;
        }).join('');
      }

      showState('stats');
    }

    // ── UI ヘルパー ───────────────────────────────────────────────
    function showState(state) {
      document.getElementById('loading').classList.toggle('hidden', state !== 'loading');
      document.getElementById('errorArea').classList.toggle('hidden', state !== 'error');
      document.getElementById('tableArea').classList.toggle('hidden', state !== 'table');
      document.getElementById('emptyArea').classList.toggle('hidden', state !== 'empty');
      document.getElementById('statsArea').classList.toggle('hidden', state !== 'stats');
      if (state === 'loading') {
        document.getElementById('countLabel').textContent = '読み込み中…';
      }
    }

    function formatDate(val) {
      if (!val) return '―';
      return val.replace(/-/g, '/');
    }

    const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];

    function formatDateWithDay(val) {
      if (!val) return '―';
      const [y, m, d] = val.split('-').map(Number);
      const day = DAY_NAMES[new Date(y, m - 1, d).getDay()];
      return val.replace(/-/g, '/') + `（${day}）`;
    }

    function furikaeBadge(振替受講日) {
      if (振替受講日) {
        return `<span class="inline-block text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-medium">振替済み</span>`;
      }
      return `<span class="inline-block text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 font-medium">未振替</span>`;
    }

    const SCHOOL_COLORS = {
      '早宮校':  { bg: 'bg-blue-100',  text: 'text-blue-700'  },
      '氷川台校': { bg: 'bg-teal-100',  text: 'text-teal-700'  },
      '中村校':  { bg: 'bg-purple-100', text: 'text-purple-700' },
    };

    function schoolBadge(name) {
      const c = SCHOOL_COLORS[name] ?? { bg: 'bg-gray-100', text: 'text-gray-600' };
      return `<span class="inline-block text-xs px-2 py-0.5 rounded-full font-medium ${c.bg} ${c.text}">${name || '不明'}</span>`;
    }

    function experienceBadge(val) {
      if (val === 'あり') {
        return `<span class="inline-block text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-medium">あり</span>`;
      }
      return `<span class="inline-block text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">なし</span>`;
    }

    // ── 初回ロード ────────────────────────────────────────────────
    loadData();
  </script>
</body>
</html>
