            <a href="../" class="flex items-center gap-2">

            </a>
            <nav class="hidden md:flex gap-6 text-sm font-medium text-gray-600">
                <a href="#features" class="nav-link hover:text-primary transition">特徴</a>
                <a href="#flow" class="nav-link hover:text-primary transition">体験の流れ</a>

<!-- FV (Hero) -->

        <div class="max-w-6xl mx-auto px-4 sm:px-6 relative z-10">
            <div class="space-y-3 md:space-y-4 text-left">

                    <div class="inline-block bg-white/90 backdrop-blur-sm px-3 py-0.5 md:px-4 md:py-1 rounded-full border border-primary/20 shadow-sm">

                    </div>
                </div>

                <div class="shimmer-badge inline-flex items-center gap-1.5 rounded-full px-4 py-1.5 shadow-md my-3">

                    <span class="text-white text-display font-black text-xs md:text-sm tracking-wide whitespace-nowrap">【開校記念】入会金0円！</span>

                </div>

                <h2 class="flex flex-col gap-1.5 md:gap-2.5 font-bold text-display text-2xl md:text-4xl leading-tight">

                    <span class="block"><span class="fv-hl"><span class="text-primary">集中力</span>と<span class="text-primary">計算力</span>。</span></span>
                    <span class="block md:hidden"><span class="fv-hl">そろばんで、</span></span>
                    <span class="block md:hidden"><span class="fv-hl">考える力が育つ。</span></span>
                    <span class="hidden md:block"><span class="fv-hl">そろばんで、考える力が育つ。</span></span>

                <p class="fv-sub max-w-xl">珠算式あんざんで、計算力だけでなく集中力・判断力をバランスよく育てます。</p>

                <div class="flex justify-start">
                    <span class="bg-white text-amber-700 px-3 py-1 md:px-4 md:py-1.5 rounded-full text-xs md:text-sm font-bold border border-secondary/60 shadow-sm"><i class="fa-solid fa-child-reaching mr-1 md:mr-1.5 text-secondary"></i>年中(4歳)〜小学生対象・週1回から</span>
                </div>

                <div class="flex flex-wrap justify-start gap-2 md:gap-2.5">
                    <span class="bg-white/80 text-primary px-2.5 py-0.5 md:px-3 md:py-1 rounded-md text-xs md:text-sm font-bold border border-primary/20"><i class="fa-solid fa-check mr-1"></i>通い始めて3ヶ月で変化が出る</span>
                    <span class="bg-white/80 text-primary px-2.5 py-0.5 md:px-3 md:py-1 rounded-md text-xs md:text-sm font-bold border border-primary/20"><i class="fa-solid fa-check mr-1"></i>他の習い事と両立できる</span>
                    <span class="bg-white/80 text-primary px-2.5 py-0.5 md:px-3 md:py-1 rounded-md text-xs md:text-sm font-bold border border-primary/20"><i class="fa-solid fa-check mr-1"></i>検定で自信がつく</span>
                </div>

                <div class="pt-1 md:pt-2">
                    <a href="#form" class="btn-shine bg-secondary hover:bg-yellow-500 text-white text-base md:text-lg font-bold py-3 px-6 md:py-3.5 md:px-8 rounded-full shadow-lg transition transform hover:-translate-y-1 inline-block w-full md:w-auto text-center md:text-left">

<!-- Mobile Fixed Bottom CTA -->
    <div class="fixed bottom-0 left-0 w-full bg-white border-t p-3 md:hidden z-50 flex items-center justify-between shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">

            まずは体験！<br>
