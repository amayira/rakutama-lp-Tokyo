<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="https://rakutama-tokyo.com/Pictures/favicon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://rakutama-tokyo.com/form/furikae.html">
  <title>振替連絡フォーム | 楽珠そろばん教室</title>
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background-color: #F7FBFA; }
    .font-display { font-family: 'Zen Kaku Gothic New', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#F7FBFA]">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="https://rakutama-tokyo.com/">
        <img src="https://rakutama-tokyo.com/Pictures/title.png" alt="楽珠そろばん教室" class="h-10 object-contain" />
      </a>
      <span class="hidden md:block text-sm font-medium text-gray-600">楽珠そろばん教室 各種申込フォーム</span>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8">

    <a href="index" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 mb-6 transition">
      <i class="fa-solid fa-arrow-left text-xs"></i>
      トップに戻る
    </a>

    <div id="form-card" class="bg-white rounded-2xl shadow-md p-6 md:p-8">
      <div class="mb-6">
        <h1 class="text-xl font-black text-gray-800 font-display mb-2">振替連絡フォーム</h1>
        <p class="text-sm text-gray-500">振替受講のご連絡はこちらから。生徒番号で教室・受講クラスを確認できます。</p>
      </div>

      <div id="error-box" class="hidden mb-4 bg-red-50 border border-red-300 text-red-700 rounded-xl px-4 py-3 text-sm"></div>

      <!-- Student Lookup -->
      <div class="mb-6 p-4 bg-gray-50 rounded-xl border border-gray-200">
        <label class="block text-sm font-medium text-gray-700 mb-2">生徒番号</label>
        <div class="flex gap-2">
          <input type="text" id="student-number" placeholder="例：A0000"
            class="min-w-0 flex-1 border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-300 focus:border-green-400" />
          <button type="button" id="lookup-btn"
            class="flex-shrink-0 border-2 border-green-500 text-green-600 font-bold text-sm px-4 py-2 rounded-lg hover:bg-green-50 transition font-display flex items-center gap-2">
            <span id="lookup-text">検索</span>
            <i id="lookup-spinner" class="fa-solid fa-spinner fa-spin hidden text-xs"></i>
          </button>
        </div>
        <div id="lookup-error" class="hidden mt-2 text-xs text-red-600"></div>
        <div id="student-info" class="hidden mt-3 bg-white border border-green-200 rounded-lg p-3">
          <div class="flex items-center gap-2 mb-2">
            <i class="fa-solid fa-circle-check text-green-500 text-sm"></i>
            <span class="text-xs font-bold text-green-600">生徒情報が見つかりました</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div class="bg-gray-50 rounded-lg p-2">
              <div class="text-xs text-gray-400 mb-0.5">教室名</div>
              <div id="info-classroom" class="text-sm font-medium text-gray-800"></div>
            </div>
            <div class="bg-gray-50 rounded-lg p-2">
              <div class="text-xs text-gray-400 mb-0.5">受講中クラス</div>
              <div id="info-jugyo" class="text-sm font-medium text-gray-800"></div>
            </div>
          </div>
        </div>
      </div>

      <form id="furikae-form" novalidate>

        <div class="mb-8">
          <div class="mb-4">
            <span class="text-xs font-black border-2 border-[#4A96AE] text-[#4A96AE] rounded-full px-4 py-1 font-display">振替受講の内容</span>
          </div>

          <!-- 使用するチケット -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">使用するチケット <span class="text-red-500">*</span></label>
            <div class="relative">
              <select id="ticket-select" required disabled
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-300 focus:border-green-400 bg-white disabled:bg-gray-100 disabled:text-gray-400">
                <option value="">生徒番号を検索してください</option>
              </select>
              <i id="ticket-spinner" class="fa-solid fa-spinner fa-spin hidden absolute right-3 top-3 text-gray-400 text-xs"></i>
            </div>
            <p id="ticket-error" class="hidden mt-1 text-xs text-red-500"></p>
          </div>

          <!-- 振替受講教室 -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">振替受講教室 <span class="text-red-500">*</span></label>
            <select id="furikae-classroom" disabled
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-300 focus:border-green-400 bg-white disabled:bg-gray-100 disabled:text-gray-400">
              <option value="">チケットを選択してください</option>
              <option value="早宮校">早宮校（火・金）</option>
              <option value="氷川台校">氷川台校（月・水）</option>
              <option value="中村校">中村校（月・木）</option>
            </select>
            <p class="mt-1 text-xs text-gray-400">別の教室で受講する場合は変更してください</p>
          </div>

          <!-- 振替受講日 -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">振替受講日 <span class="text-red-500">*</span></label>
            <input type="date" id="furikae-date" required disabled
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-300 focus:border-green-400 disabled:bg-gray-100 disabled:text-gray-400" />
            <p id="furikae-date-hint" class="mt-1 text-xs text-gray-400"></p>
          </div>

          <!-- 時刻 -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">時刻</label>
            <select id="furikae-time"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-300 focus:border-green-400 bg-white">
              <option value="">生徒番号を検索すると選択肢が表示されます</option>
            </select>
          </div>

          <!-- 備考 -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">備考 <span class="text-gray-400 text-xs font-normal">任意</span></label>
            <textarea id="notes" rows="3"
              placeholder="その他ご連絡事項があればご記入ください"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-300 focus:border-green-400 resize-y"></textarea>
          </div>
        </div>

        <button type="submit" id="submit-btn" disabled
          class="w-full bg-green-500 hover:bg-green-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-black text-base py-3 rounded-full shadow-md transition font-display flex items-center justify-center gap-2">
          <span id="submit-text">送信する</span>
          <i id="submit-spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
        </button>
        <p id="submit-hint" class="text-xs text-center mt-2 text-amber-600 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i>上の生徒番号欄で「検索」を押してから送信してください</p>

      </form>
    </div>

    <div id="success-screen" class="hidden bg-white rounded-2xl shadow-md p-8 text-center">
      <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-check text-green-500 text-2xl"></i>
      </div>
      <h2 class="text-xl font-black text-gray-800 font-display mb-3">送信が完了しました</h2>
      <p class="text-sm text-gray-500 mb-6">振替受講のご連絡を受け付けました。</p>
      <a href="index"
        class="inline-block bg-green-500 hover:bg-green-600 text-white font-black text-sm py-2.5 px-8 rounded-full shadow-md transition font-display">
        トップに戻る
      </a>
    </div>

  </main>

  <footer class="text-center py-8 text-xs text-gray-400">
    <p>&copy; 2026 Alpha-Brain LLC.</p>
  </footer>

  <script src="/js/form-common.js"></script>
  <script>
    // 振替取得状況ページの「この日程で予約する」から遷移した場合、生徒番号検索とチケット選択を自動化する
    const urlParams = new URLSearchParams(window.location.search);
    const prefillStudentNumber = urlParams.get('studentNumber');
    const prefillTicketId = urlParams.get('ticketId');

    let ticketReqId = 0;

    // 週2コース：メインの生徒番号（"-"より前）を返す
    function baseStudentNumber(num) {
      return String(num).split('-')[0];
    }

    // 授業ID/名から "HH:MM" を抽出（例: "早宮校-火1700" → "17:00", "16時クラス" → "16:00"）
    function extractTime(cls) {
      const mId = String(cls.id).match(/(\d{2})(\d{2})$/);
      if (mId) return `${mId[1]}:${mId[2]}`;
      const mId2 = String(cls.id).match(/(\d{2})$/);
      if (mId2) return `${mId2[1]}:00`;
      const mName = String(cls.name).match(/(\d{1,2})時/);
      if (mName) return `${mName[1].padStart(2, '0')}:00`;
      return '';
    }

    function fmtDate(ymd) {
      if (!ymd) return '';
      const [y, m, d] = ymd.split('-');
      return `${y}年${parseInt(m)}月${parseInt(d)}日`;
    }
    function fmtShort(ymd) {
      if (!ymd) return '';
      const [, m, d] = ymd.split('-');
      return `${parseInt(m)}月${parseInt(d)}日`;
    }

    // 選択中チケットの期日（振替受講日のmin/max制御に使用）
    let currentTickets = [];

    // ── チケット取得（生徒番号のみで絞り込み。日付には依存しない）────────────────
    async function loadTickets() {
      const myId = ++ticketReqId;
      const ticketSelect = document.getElementById('ticket-select');
      const ticketSpinner = document.getElementById('ticket-spinner');
      const ticketError = document.getElementById('ticket-error');

      ticketSelect.innerHTML = '<option value="">選択してください</option>';
      ticketSelect.disabled = true;
      ticketError.classList.add('hidden');
      ticketError.textContent = '';
      currentTickets = [];

      if (!studentData) return;

      // サブ番号（A0001-2）でも入力できるよう、ベース番号でまとめて検索
      const studentNumber = baseStudentNumber(document.getElementById('student-number').value.trim());
      ticketSpinner.classList.remove('hidden');

      try {
        const res = await fetch(
          `${API_BASE}/api/furikae-tickets?studentNumber=${encodeURIComponent(studentNumber)}`
        );
        const data = await res.json();
        if (myId !== ticketReqId) return; // 古いリクエストは破棄

        if (!res.ok || !data.success) throw new Error(data.error || 'チケットの取得に失敗しました');

        if (data.tickets.length === 0) {
          ticketSelect.innerHTML = '<option value="">利用可能なチケットがありません</option>';
          ticketError.textContent = '使用できる振替チケットが見つかりませんでした。';
          ticketError.classList.remove('hidden');
        } else {
          currentTickets = data.tickets;
          data.tickets.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.id;
            const period = (t['振替期日_始_'] && t['振替期日_終_'])
              ? `　期限：${fmtShort(t['振替期日_始_'])}〜${fmtShort(t['振替期日_終_'])}`
              : '';
            opt.textContent = `欠席日：${fmtDate(t['欠席日'])}${period}`;
            ticketSelect.appendChild(opt);
          });
          ticketSelect.disabled = false;
        }
      } catch (err) {
        if (myId !== ticketReqId) return;
        ticketError.textContent = err.message || 'チケット情報の取得中にエラーが発生しました。';
        ticketError.classList.remove('hidden');
      } finally {
        if (myId === ticketReqId) ticketSpinner.classList.add('hidden');
      }
    }

    // チケット選択 → 教室・振替受講日を有効化し、選んだチケットの振替期日で日付範囲を制限
    document.getElementById('ticket-select').addEventListener('change', function () {
      const classroomSelect = document.getElementById('furikae-classroom');
      const dateInput = document.getElementById('furikae-date');
      const dateHint = document.getElementById('furikae-date-hint');
      const submitBtn = document.getElementById('submit-btn');
      const submitHint = document.getElementById('submit-hint');

      const ticket = currentTickets.find(t => t.id === this.value);
      if (!ticket) {
        classroomSelect.disabled = true;
        classroomSelect.value = '';
        dateInput.disabled = true;
        dateInput.value = '';
        dateHint.textContent = '';
        submitBtn.disabled = true;
        submitHint.classList.remove('hidden');
        return;
      }

      classroomSelect.disabled = false;
      dateInput.disabled = false;
      dateInput.min = ticket['振替期日_始_'] || '';
      dateInput.max = ticket['振替期日_終_'] || '';
      dateInput.value = '';
      dateHint.textContent = (ticket['振替期日_始_'] && ticket['振替期日_終_'])
        ? `${fmtDate(ticket['振替期日_始_'])}〜${fmtDate(ticket['振替期日_終_'])}の間で選択してください`
        : '';
      submitBtn.disabled = true;
      submitHint.classList.remove('hidden');
    });

    document.getElementById('furikae-classroom').addEventListener('change', function () {
      loadTimeSlotsInto('furikae-time', this.value);
    });

    document.getElementById('furikae-date').addEventListener('change', function () {
      const submitBtn = document.getElementById('submit-btn');
      const submitHint = document.getElementById('submit-hint');
      const ready = !!document.getElementById('ticket-select').value && !!this.value;
      submitBtn.disabled = !ready;
      submitHint.classList.toggle('hidden', ready);
    });

    // 生徒番号検索（共通処理 /js/form-common.js。submitはチケット選択後に有効化されるため自動有効化しない）
    setupStudentLookup({
      enableSubmitOnSuccess: false,
      onReset: () => {
        // チケット・教室・振替受講日・時刻をリセット
        document.getElementById('ticket-select').innerHTML = '<option value="">生徒番号を検索してください</option>';
        document.getElementById('ticket-select').disabled = true;
        document.getElementById('ticket-error').classList.add('hidden');
        currentTickets = [];
        const classroomSelect = document.getElementById('furikae-classroom');
        classroomSelect.value = '';
        classroomSelect.disabled = true;
        const dateInput = document.getElementById('furikae-date');
        dateInput.value = '';
        dateInput.disabled = true;
        document.getElementById('furikae-date-hint').textContent = '';
        document.getElementById('furikae-time').innerHTML = '<option value="">選択してください</option>';
      },
      onSuccess: async (s) => {
        // チケット一覧を取得（教室は生徒のホーム教室をプリセットしておく）
        const classroomSelect = document.getElementById('furikae-classroom');
        if (s.records[0]?.classroom) classroomSelect.value = s.records[0].classroom;
        await loadTimeSlotsInto('furikae-time', classroomSelect.value);
        await loadTickets();

        // URLでチケットIDが指定されていれば選択状態にして日付範囲などを反映
        if (prefillTicketId) {
          const ticketSelect = document.getElementById('ticket-select');
          if ([...ticketSelect.options].some(o => o.value === prefillTicketId)) {
            ticketSelect.value = prefillTicketId;
            ticketSelect.dispatchEvent(new Event('change'));
          }
        }
      },
    });

    // URLで生徒番号が指定されていれば自動検索（振替取得状況ページからの遷移）
    if (prefillStudentNumber) {
      document.getElementById('student-number').value = prefillStudentNumber;
      document.getElementById('lookup-btn').click();
    }

    // ── Form submission ───────────────────────────────────────────────────────
    document.getElementById('furikae-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const errorBox = document.getElementById('error-box');
      errorBox.classList.add('hidden');
      errorBox.textContent = '';

      const furikaeDate = document.getElementById('furikae-date').value;
      const furikaeClassroom = document.getElementById('furikae-classroom').value;
      const ticketSelect = document.getElementById('ticket-select');
      const ticketId = ticketSelect.value;
      const furikaeTime = document.getElementById('furikae-time').value;
      const notes = document.getElementById('notes').value.trim();

      const errors = [];
      if (!studentData) errors.push('生徒番号を検索してください');
      if (!furikaeClassroom) errors.push('振替受講教室を選択してください');
      if (!furikaeDate) errors.push('振替受講日を選択してください');
      if (!ticketId) errors.push('使用するチケットを選択してください');

      if (errors.length > 0) {
        errorBox.innerHTML = errors.join('<br />');
        errorBox.classList.remove('hidden');
        errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      const submitText = document.getElementById('submit-text');
      const submitSpinner = document.getElementById('submit-spinner');
      submitBtn.disabled = true;
      submitText.textContent = '送信中...';
      submitSpinner.classList.remove('hidden');

      try {
        const response = await fetch(`${API_BASE}/api/furikae`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ticketId,
            生徒番号: studentData?.student?.records?.[0]?.studentNumber ?? '',
            振替受講日: furikaeDate,
            振替受講教室: furikaeClassroom,
            時刻: furikaeTime,
            備考: notes,
          }),
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || data.message || `送信に失敗しました（${response.status}）`);
        }

        document.getElementById('form-card').classList.add('hidden');
        document.getElementById('success-screen').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });

      } catch (err) {
        errorBox.textContent = err.message || '送信中にエラーが発生しました。しばらく経ってから再度お試しください。';
        errorBox.classList.remove('hidden');
        errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        submitBtn.disabled = false;
        submitText.textContent = '送信する';
        submitSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
